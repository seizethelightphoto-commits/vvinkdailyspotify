name: Daily Spotify Listener Scraper

on:
  schedule:
    # Runs every day at 00:00 UTC (Midnight UTC).
    # You can change '0 0' to adjust the hour for your timezone if necessary.
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows you to manually trigger the workflow from the GitHub Actions tab

jobs:
  scrape_data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial: Gives the workflow permission to commit files

    steps:
      - name: Checkout Repository
        # Downloads your repository code onto the runner
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        # Installs 'requests' and 'beautifulsoup4' from requirements.txt
        run: pip install -r requirements.txt

      - name: Run Scraper Script
        # Executes the Python file which fetches the data and updates the JSON
        run: python spotify_scraper.py

      - name: Commit and Push Changes
        # This step commits the updated listeners_history.json file back to the repository
        run: |
          # 1. Configure Git credentials
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          
          # 2. Check for changes in the JSON file
          if git diff --exit-code listeners_history.json > /dev/null; then
              echo "No changes in listeners_history.json. Skipping commit."
          else
              # 3. Add file and commit
              git add listeners_history.json
              git commit -m "📈 Auto-update: Spotify monthly listener count for $(date +'%Y-%m-%d')"
              
              # 4. Push the commit
              git push
              echo "Committed new data to repository."
          fi
